# Nextcloud
server {
    listen 40050 ssl http2;
    listen [::]:40050 ssl http2;
    server_name cloud-home.dxh-wds.top;

    ssl_certificate /home/wds/.ssl/fullchain.pem;
    ssl_certificate_key /home/wds/.ssl/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 5m;

    client_max_body_size 10G;
    client_body_timeout 300s;
    
    # Nextcloud 安全头部
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    
    # HTTP 请求重定向到 HTTPS（如果用户误用 http 访问）
    error_page 497 301 https://$http_host$request_uri;

    location / {
        # 关键：这些 proxy_set_header 的顺序和内容很重要！
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;  # 注意是 https 不是 $scheme
        proxy_set_header Host $http_host;          # 注意是 $http_host 不是 $host
        
        proxy_pass http://localhost:40069;
        
        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 禁用缓冲
        proxy_request_buffering off;
        proxy_buffering off;
        
        # 超时设置
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }
}
# 新增代理服务 (本地 40156 -> 对外 HTTPS 40157) onluoffice
# 新增代理服务 (本地 40156 -> 对外 HTTPS 40157) - OnlyOffice 专用配置
server {
    listen 40157 ssl http2;
    listen [::]:40157 ssl http2;
    server_name cloud-home.dxh-wds.top;

    # SSL 证书配置
    ssl_certificate /home/wds/.ssl/fullchain.pem;
    ssl_certificate_key /home/wds/.ssl/privkey.pem;
    
    # SSL 优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 1. 允许上传较大的文档（OnlyOffice 加载和保存文件需要）
    client_max_body_size 100M; 

    location / {
        proxy_pass http://localhost:40156;
        
        # 2. 关键 Header 传递
        proxy_set_header Host $http_host; # 使用 $http_host 会保留外部端口号(40157)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 告诉 OnlyOffice 外部使用的是 HTTPS，这对它生成内部跳转链接至关重要
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host; 
        
        # 3. WebSocket 支持（协同编辑的核心）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 4. 防止 WebSocket 长连接因为无操作而过早超时断开
        proxy_read_timeout 3600s;
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}


# 听见贵阳（本地 dist -> 对外 HTTPS 31111）
server {
    listen 31111 ssl http2;
    listen [::]:31111 ssl http2;
    server_name cloud-home.dxh-wds.top;

    ssl_certificate /home/wds/.ssl/fullchain.pem;
    ssl_certificate_key /home/wds/.ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /home/wds/workspace/static-site/Hear‑GuiYang;
    index index.html;

    # Gaussian Splat 需要 SharedArrayBuffer
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml application/wasm;

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|wav|ply|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
